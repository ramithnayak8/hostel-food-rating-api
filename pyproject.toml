[project]
name = "hostel-food-rating-api"
version = "1.0.0"
description = "Students rate hostel meals; wardens see what's working and what isn't."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RET", "PT", "N"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S311", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
