# Ansible lab: a control node and one managed host, both containers.
#
#   docker compose -f ansible/docker-compose.yml up -d --build app-server
#   docker compose -f ansible/docker-compose.yml run --rm ansible ansible-playbook -i inventory playbook.yml
#   curl http://localhost:8081/health
#
# The playbook deploys dist/hostel-food-api-*.pyz, so build it first (make package).
name: hostel-food-ansible

services:
  app-server:
    build: docker/app-server
    hostname: app-server
    # systemd as PID 1 needs these inside a container.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ssh_keys:/keys:ro
    ports:
      # host 8081 -> app_port (8000 by default; change both together).
      - "8081:8000"

  ansible:
    build: docker/control-node
    depends_on:
      - app-server
    working_dir: /workspace/ansible
    environment:
      # Explicit, because Ansible ignores an ansible.cfg in a world-writable folder (Windows mounts).
      ANSIBLE_CONFIG: /workspace/ansible/ansible.cfg
    volumes:
      - ..:/workspace:ro
      - ssh_keys:/keys
    profiles:
      - tools

volumes:
  ssh_keys:
