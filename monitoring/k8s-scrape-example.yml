# Example Prometheus scrape config for running Prometheus INSIDE a Kubernetes cluster.
# The API pods carry these annotations (see k8s/base):
#   prometheus.io/scrape: "true"
#   prometheus.io/port:   "8000"
#   prometheus.io/path:   "/metrics"
# Merge this job into your in-cluster Prometheus config (Prometheus needs RBAC to list/watch pods).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hostel-food-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [hostel-food]
    relabel_configs:
      # Keep only pods that opt in via annotation.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Honour a custom metrics path.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Honour a custom port.
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
