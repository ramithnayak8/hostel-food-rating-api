# Single-node kind cluster for local demos (used by scripts/kind-up.sh).
#
# ingress-nginx binds hostPorts 80/443 on the node; they are published on the host as 8080/8443
# so nothing needs root/admin rights or clashes with a local web server:
#   http://hostel-food.localtest.me:8080  (localtest.me always resolves to 127.0.0.1)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hostel-food
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
