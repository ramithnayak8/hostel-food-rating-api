# PLACEHOLDER VALUES ONLY. Never commit real secrets to this file.
#
# Replace this Secret before deploying anywhere real (see secret.example.yaml for the command).
# The placeholder JWT_SECRET is deliberately too short: with ENV=production the API refuses to
# start until a real secret (>= 32 characters) is supplied, so a forgotten placeholder fails loudly.
apiVersion: v1
kind: Secret
metadata:
  name: hostel-food-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://hostel:REPLACE_ME@postgres:5432/hostel_food"
