# Example only: this file is NOT referenced by kustomization.yaml and is never applied.
#
# Create the real Secret directly in the cluster (nothing touches git):
#
#   JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
#   PG_PASSWORD=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
#   kubectl create secret generic hostel-food-secrets \
#     --namespace hostel-food \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://hostel:${PG_PASSWORD}@postgres:5432/hostel_food" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Then remove secret.yaml from k8s/base/kustomization.yaml (or keep it out of your overlay) so a later
# `kubectl apply -k` does not overwrite the real values with placeholders. For GitOps, store it
# encrypted instead (Sealed Secrets, SOPS, or External Secrets Operator).
#
# The generated manifest looks like this (values are base64-encoded by kubectl):
apiVersion: v1
kind: Secret
metadata:
  name: hostel-food-secrets
  namespace: hostel-food
type: Opaque
data:
  JWT_SECRET: <base64 of a random string, at least 32 characters>
  POSTGRES_PASSWORD: <base64 of the database password>
  DATABASE_URL: <base64 of postgresql+psycopg://hostel:PASSWORD@postgres:5432/hostel_food>
